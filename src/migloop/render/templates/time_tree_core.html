<script>
  (function (root, factory) {
    "use strict";
    var api = factory();
    if (typeof module === "object" && module.exports) module.exports = api;
    if (root) root.MigloopTimeTree = api;
  })(typeof window === "object" ? window : globalThis, function () {
    "use strict";

    function object(value) {
      return (
        value !== null && typeof value === "object" && !Array.isArray(value)
      );
    }

    function text(value) {
      return typeof value === "string" && value.trim().length > 0;
    }

    function invalid(message) {
      throw new TypeError(message);
    }

    function fields(value, allowed) {
      if (
        !object(value) ||
        Object.keys(value).some(function (key) {
          return allowed.indexOf(key) < 0;
        })
      ) {
        invalid("Unexpected fields in time scope or query");
      }
    }

    function normalizeTime(value) {
      // Date is used only for whole seconds. Its millisecond precision must never
      // merge distinct source timestamps or model claims within one millisecond.
      if (typeof value !== "string")
        invalid("A concrete timezone-aware ISO time is required");
      var match =
        /^(\d{4})-(\d{2})-(\d{2})[Tt](\d{2}):(\d{2}):(\d{2})(?:\.(\d{1,6}))?([Zz]|[+-]\d{2}:\d{2})$/.exec(
          value,
        );
      if (!match)
        invalid(
          "Expected ISO time with at most six fractional digits and an explicit timezone",
        );
      var year = Number(match[1]),
        month = Number(match[2]),
        day = Number(match[3]);
      var hour = Number(match[4]),
        minute = Number(match[5]),
        second = Number(match[6]);
      if (
        year < 1 ||
        month < 1 ||
        month > 12 ||
        day < 1 ||
        day > 31 ||
        hour > 23 ||
        minute > 59 ||
        second > 59
      ) {
        invalid("Invalid calendar time");
      }
      var date = new Date(0);
      date.setUTCFullYear(year, month - 1, day);
      date.setUTCHours(hour, minute, second, 0);
      if (
        date.getUTCFullYear() !== year ||
        date.getUTCMonth() !== month - 1 ||
        date.getUTCDate() !== day
      ) {
        invalid("Invalid calendar date");
      }
      var zone = match[8],
        offset = 0;
      if (zone.toUpperCase() !== "Z") {
        var zoneHour = Number(zone.slice(1, 3)),
          zoneMinute = Number(zone.slice(4, 6));
        if (zoneHour > 23 || zoneMinute > 59)
          invalid("Invalid timezone offset");
        offset = (zoneHour * 60 + zoneMinute) * (zone[0] === "+" ? 1 : -1);
      }
      date = new Date(date.getTime() - offset * 60000);
      if (date.getUTCFullYear() < 1 || date.getUTCFullYear() > 9999)
        invalid("UTC time is outside the supported calendar");
      return (
        date.toISOString().slice(0, 19) +
        "." +
        (match[7] || "").padEnd(6, "0") +
        "Z"
      );
    }

    function scope(value) {
      fields(value, ["kind", "key", "at", "since_ts", "id"]);
      if (["file", "agent", "pool"].indexOf(value.kind) < 0)
        invalid("Unsupported scope kind");
      if (value.kind === "pool" ? value.key != null : !text(value.key))
        invalid("Invalid scope entity");
      var at = normalizeTime(value.at);
      var since = value.since_ts == null ? null : normalizeTime(value.since_ts);
      if (since !== null && since > at)
        invalid("Scope start is after its cutoff");
      // Canonical entity keys come from the server. Do not normalize paths, guess
      // aliases or include the opaque backend scope id in local equality tests.
      return {
        kind: value.kind,
        key: value.kind === "pool" ? null : value.key,
        at: at,
        since_ts: since,
      };
    }

    function scopeKey(value) {
      var current = scope(value);
      return JSON.stringify([
        current.kind,
        current.key,
        current.at,
        current.since_ts,
      ]);
    }

    function operationKey(row) {
      if (
        !object(row) ||
        !text(row.id) ||
        !object(row.operation) ||
        !text(row.operation.kind)
      ) {
        invalid("An indexed operation id and kind are required");
      }
      var path = row.operation.path;
      if (path != null && !text(path)) invalid("Invalid operation target");
      // One event id can be shared by several targets and operation kinds.
      return JSON.stringify([
        row.id,
        row.operation.kind,
        path == null ? null : path,
      ]);
    }

    function queryTarget(query, kind, key, at) {
      fields(query, ["tool", "args", "scope"]);
      if (query.tool !== kind || !object(query.args))
        invalid("Wrong navigation endpoint");
      var field = kind === "file" ? "path" : "id";
      var args = query.args;
      fields(args, [
        field,
        "at",
        "since_ts",
        "view",
        "offset",
        "limit",
        "include_undated",
        "details",
      ]);
      if (
        args[field] !== key ||
        (args.view != null && args.view !== "overview")
      )
        invalid("Navigation target mismatch");
      if (
        args.offset != null &&
        (!Number.isInteger(args.offset) || args.offset < 0)
      )
        invalid("Invalid query offset");
      if (
        args.limit != null &&
        (!Number.isInteger(args.limit) || args.limit < 1 || args.limit > 200)
      )
        invalid("Invalid query limit");
      ["include_undated", "details"].forEach(function (flag) {
        if (args[flag] != null && typeof args[flag] !== "boolean")
          invalid("Invalid query flag");
      });
      var target = scope({
        kind: kind,
        key: args[field],
        at: args.at,
        since_ts: args.since_ts,
      });
      if (target.at !== at || target.since_ts !== null)
        invalid("Navigation time mismatch");
      if (query.scope != null && scopeKey(query.scope) !== scopeKey(target))
        invalid("Inherited query scope mismatch");
      return target;
    }

    function relation(parentScope, row, section) {
      try {
        var parent = scope(parentScope);
        if (parent.kind === "pool" || !object(row) || !object(row.operation))
          return null;
        var op = row.operation;
        if (
          ["read", "write", "delete"].indexOf(op.kind) < 0 ||
          !text(op.path) ||
          !text(row.agent)
        )
          return null;
        if (
          parent.kind === "file"
            ? parent.key !== op.path
            : parent.key !== row.agent
        )
          return null;
        var confirmed =
          ((section === "reads" && op.kind === "read") ||
            (section === "writes" &&
              (op.kind === "write" || op.kind === "delete"))) &&
          op.status === "confirmed";
        var candidate = section === "candidates" && op.status === "candidate";
        if (!confirmed && !candidate) return null;
        var use = normalizeTime(row.use_ts);
        var done = row.done_ts == null ? null : normalizeTime(row.done_ts);
        if (done !== null && done < use) return null;
        var stamp = done === null ? use : done;
        if (
          use > parent.at ||
          stamp > parent.at ||
          (parent.since_ts !== null && stamp < parent.since_ts)
        )
          return null;
        if (normalizeTime(row.ts) !== stamp) return null;
        if (
          confirmed &&
          (done === null ||
            row.call_state !== "returned" ||
            row.reference_status !== "addressable" ||
            op.execution !== "confirmed")
        )
          return null;
        var target =
          parent.kind === "file"
            ? queryTarget(row.agent_query, "agent", row.agent, use)
            : queryTarget(row.file_query, "file", op.path, stamp);
        var direction =
          (parent.kind === "file") === (op.kind !== "read")
            ? "upstream"
            : "downstream";
        var name = { read: "读取", write: "写入", delete: "删除" }[op.kind];
        return {
          target: target,
          kind: op.kind,
          status: confirmed ? "confirmed" : "candidate",
          evidence: row,
          direction: direction,
          label: confirmed
            ? "历史" + name + "操作 · 已返回"
            : "候选" + name + "操作 · 未确认",
        };
      } catch (_) {
        return null;
      }
    }

    function boundClaim(claim) {
      if (
        !object(claim) ||
        !object(claim.binding) ||
        claim.binding.status !== "matched" ||
        ["file", "agent"].indexOf(claim.kind) < 0
      )
        return null;
      var current = scope({
        kind: claim.kind,
        key: claim.binding.canonical_key,
        at: claim.binding.at,
        since_ts: null,
      });
      if (normalizeTime(claim.at) !== current.at) return null;
      return current;
    }

    function claimMatches(graph, claim, selectedScope) {
      try {
        if (
          !object(graph) ||
          !object(graph.identity) ||
          graph.identity.bound !== true
        )
          return false;
        var selected = scope(selectedScope),
          declared = boundClaim(claim);
        return (
          selected.since_ts === null &&
          declared !== null &&
          scopeKey(selected) === scopeKey(declared)
        );
      } catch (_) {
        return false;
      }
    }

    function modelEdgeAllowed(graph, edge) {
      try {
        if (
          !object(graph) ||
          !object(graph.identity) ||
          graph.identity.bound !== true ||
          !Array.isArray(graph.nodes) ||
          !object(edge) ||
          edge.drawable === false ||
          !object(edge.binding) ||
          ["confirmed", "candidate"].indexOf(edge.binding.status) < 0 ||
          ["read", "write", "possible_read", "possible_write"].indexOf(
            edge.relation,
          ) < 0 ||
          !text(edge.from) ||
          !text(edge.to) ||
          edge.from === edge.to
        )
          return false;
        var left = graph.nodes.filter(function (node) {
          return object(node) && node.id === edge.from;
        });
        var right = graph.nodes.filter(function (node) {
          return object(node) && node.id === edge.to;
        });
        if (
          left.length !== 1 ||
          right.length !== 1 ||
          !boundClaim(left[0]) ||
          !boundClaim(right[0])
        )
          return false;
        var source = left[0],
          target = right[0],
          read = edge.relation === "read" || edge.relation === "possible_read";
        if (
          source.kind !== (read ? "file" : "agent") ||
          target.kind !== (read ? "agent" : "file")
        )
          return false;
        if (
          source.finding != null &&
          target.finding != null &&
          source.finding !== target.finding
        )
          return false;
        if (
          edge.finding != null &&
          (source.finding !== edge.finding || target.finding !== edge.finding)
        )
          return false;
        return true;
      } catch (_) {
        return false;
      }
    }

    return Object.freeze({
      normalizeTime: normalizeTime,
      scope: scope,
      scopeKey: scopeKey,
      operationKey: operationKey,
      relation: relation,
      claimMatches: claimMatches,
      modelEdgeAllowed: modelEdgeAllowed,
    });
  });
</script>
