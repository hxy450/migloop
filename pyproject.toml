[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migloop"
version = "0.3.0"
description = "Provider-neutral migration session lineage viewer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
migloop = "migloop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"migloop.render.templates" = ["*.html"]

